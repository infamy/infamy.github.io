<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttons · Alex Harvey</title>
<meta name="description" content="A wall of 88x31 buttons, mine included.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07040d;
    --panel: #0f0a18;
    --cyan: #00fff7;
    --magenta: #ff00ff;
    --yellow: #fff200;
    --text: #ece8f4;
    --muted: #9a91ab;
    --line: rgba(0,255,247,.2);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "IBM Plex Mono", ui-monospace, monospace; }
  a { color: var(--cyan); }
  a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }
  .back { font-size: 13px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--cyan); }
  h1 { font-family: "Chakra Petch", sans-serif; margin: 0; }
  h1 { font-size: 2rem; margin-top: 18px; }
  p { margin: 8px 0 0; color: #d4cde2; }
  img.b88 { display: block; width: 88px; height: 31px; image-rendering: pixelated; }
  pre {
    margin: 12px 0 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
    font: 13px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--text);
    white-space: pre-wrap; word-break: break-all;
  }
  .wall { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; }
  .wall a { display: block; line-height: 0; }
  .grab { margin-top: 32px; font-size: 13px; color: var(--muted); }
  @media (max-width: 640px) { main { padding: 32px 16px 64px; } }
</style>
</head>
<body>
<main>
  <a class="back" href="/">← meshmeld.com</a>
  <h1>Buttons</h1>
  <p>88x31s, the old-web way of linking to each other. Want to trade? Find me on <a href="https://github.com/infamy/">GitHub</a>.</p>

  <!-- Add new buttons at the end. Keep a local copy of each gif in 88x31/:
       <a href="https://example.com/"><img class="b88" src="88x31/example.gif" width="88" height="31" alt="example.com"></a> -->
  <div class="wall">
    <a href="https://www.meshmeld.com/"><img class="b88" src="meshmeld-88x31.gif" width="88" height="31" alt="meshmeld.com"></a>
    <a href="https://www.archlinux.org/"><img class="b88" src="88x31/archlinux.gif" width="88" height="31" alt="Arch Linux"></a>
    <a href="https://www.home-assistant.io/"><img class="b88" src="88x31/home-assistant.gif" width="88" height="31" alt="Home Assistant"></a>
    <a href="https://about.gitea.com/"><img class="b88" src="88x31/gitea.gif" width="88" height="31" alt="Gitea"></a>
    <a href="https://github.com/infamy/"><img class="b88" src="88x31/github.gif" width="88" height="31" alt="GitHub"></a>
    <a href="https://www.mozilla.org/firefox/"><img class="b88" src="88x31/firefox.gif" width="88" height="31" alt="Firefox"></a>
    <a href="https://www.google.com/chrome/"><img class="b88" src="88x31/chrome.gif" width="88" height="31" alt="Chrome"></a>
    <a href="https://eightyeightthirty.one/"><img class="b88" src="88x31/eightyeightthirtyone.png" width="88" height="31" alt="eightyeightthirty.one"></a>
    <a href="https://radiorabbit.ca/"><img class="b88" src="88x31/radiorabbit.png" width="88" height="31" alt="radiorabbit.ca"></a>
  </div>

  <p class="grab">Linking to me? Save the gif to your own server, then:</p>
  <pre>&lt;a href="https://www.meshmeld.com/"&gt;&lt;img src="meshmeld-88x31.gif" width="88" height="31" alt="meshmeld.com"&gt;&lt;/a&gt;</pre>
</main>
</body>
</html>
